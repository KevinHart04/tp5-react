services:
  db:
    build: ./database
    container_name: tp5-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    container_name: tp5-go-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080

  frontend:
    build: ./frontend
    container_name: tp5-react-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - VITE_API_URL=http://localhost:8080

volumes:
  pgdata:
